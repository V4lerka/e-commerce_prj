[project]
name = "e-commerce-prj"
version = "0.1.0"
description = ""
authors = [
    {name = "Valerii Dutov",email = "dutov_valeriy@mail.ru"}
]
requires-python = ">=3.14"
dependencies = [
    "pytest (>=9.2.0,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.5.0,<8.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'
check_untyped_defs = true
strict = true
warn_unreachable = true


[tool.isort]
profile = "black"
line_length = 119


[tool.black]
line-length = 119
target-version = ['py314']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''